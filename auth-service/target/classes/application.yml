server:
  port: 8886

spring:
  application:
    name: auth-service

  config:
    import: optional:configserver:http://localhost:8885

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8767/eureka/
    register-with-eureka: true
    fetch-registry: true

datasource:
  url: jdbc:h2:mem:testdb
  driver-class-name: org.h2.Driver
  username: sa
  password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  jwt:
    secret: SHA@123
    expirationMs: 3600000 # 1 hour