version: "3.9"

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.6
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"

  zipkin:
    image: openzipkin/zipkin:2.24
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:v2.50.1
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  eureka-server:
    build:
      context: ../../
      dockerfile: infrastructure/eureka-server/Dockerfile
    ports:
      - "8767:8767"

  config-server:
    build:
      context: ../../
      dockerfile: infrastructure/config-server/Dockerfile
    depends_on:
      - eureka-server
    environment:
      - EUREKA_URL=http://eureka-server:8767/eureka/
      - CONFIG_REPO_LOCATION=file:/config-repo
    volumes:
      - ../../infrastructure/config-repo:/config-repo:ro
    ports:
      - "8885:8885"

  api-gateway:
    build:
      context: ../../
      dockerfile: infrastructure/api-gateway/Dockerfile
    depends_on:
      - eureka-server
    environment:
      - EUREKA_URL=http://eureka-server:8767/eureka/
    ports:
      - "8881:8881"

  user-service:
    build:
      context: ../../
      dockerfile: services/user-service/Dockerfile
    depends_on:
      - eureka-server
      - config-server
      - kafka
    environment:
      - EUREKA_URL=http://eureka-server:8767/eureka/
      - CONFIG_SERVER_URL=http://config-server:8885
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8887:8887"

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Dockerfile
    depends_on:
      - eureka-server
      - config-server
    environment:
      - EUREKA_URL=http://eureka-server:8767/eureka/
      - CONFIG_SERVER_URL=http://config-server:8885
    ports:
      - "8886:8886"

  notification-service:
    build:
      context: ../../
      dockerfile: services/notification-service/Dockerfile
    depends_on:
      - eureka-server
      - config-server
      - kafka
    environment:
      - EUREKA_URL=http://eureka-server:8767/eureka/
      - CONFIG_SERVER_URL=http://config-server:8885
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8088:8088"

  order-service:
    build:
      context: ../../
      dockerfile: services/order-service/Dockerfile
    depends_on:
      - eureka-server
      - kafka
    environment:
      - EUREKA_URL=http://eureka-server:8767/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8888:8888"

  ai-assistant-service:
    build:
      context: ../../
      dockerfile: services/ai-assistant-service/Dockerfile
    depends_on:
      - eureka-server
      - kafka
    environment:
      - EUREKA_URL=http://eureka-server:8767/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8890:8890"

